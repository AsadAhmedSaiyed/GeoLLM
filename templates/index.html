<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoLLM — Autonomous Geospatial Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: rgba(22, 27, 39, 0.85);
        --border: rgba(255, 255, 255, 0.08);
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --text: #f3f4f6;
        --text-dim: #9ca3af;
        --terminal-bg: #070a11;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(11, 15, 25, 0.8);
        backdrop-filter: blur(12px);
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .badge {
        font-size: 0.75rem;
        background: rgba(59, 130, 246, 0.15);
        color: var(--primary);
        padding: 0.25rem 0.6rem;
        border-radius: 9999px;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .container {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 1.5rem;
        padding: 1.5rem 2rem;
        flex: 1;
      }
      .sidebar,
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        backdrop-filter: blur(16px);
      }
      h2 {
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-dim);
        margin-bottom: 0.75rem;
      }
      textarea,
      select,
      input {
        width: 100%;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        color: #fff;
        padding: 0.75rem;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.875rem;
        outline: none;
      }
      textarea:focus,
      input:focus {
        border-color: var(--primary);
      }
      .file-list {
        max-height: 160px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .file-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.825rem;
        padding: 0.4rem 0.6rem;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
      }
      .btn {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 0.8rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .terminal-container {
        background: var(--terminal-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 400px;
        max-height: 480px;
        overflow: hidden;
      }
      .terminal-header {
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--border);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--text-dim);
        display: flex;
        justify-content: space-between;
      }
      .terminal-body {
        padding: 1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: #38bdf8;
        overflow-y: auto;
        flex: 1;
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .chat-bar {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        background: rgba(0, 0, 0, 0.5);
        border-top: 1px solid var(--border);
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }
      .gallery-item {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .gallery-item img {
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: #000;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .gallery-item img:hover {
        transform: scale(1.02);
      }
      .gallery-caption {
        padding: 0.6rem;
        font-size: 0.8rem;
        color: var(--text-dim);
        border-top: 1px solid var(--border);
      }
      .file-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        font-size: 0.8rem;
        color: #fff;
        text-decoration: none;
        margin: 0.25rem;
      }
      .file-badge:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span>🛰️ GeoLLM</span>
        <span class="badge">Autonomous Geospatial Agent</span>
      </div>
      <div
        id="status-indicator"
        style="font-size: 0.85rem; color: var(--text-dim)"
      >
        ● Idle
      </div>
    </header>

    <div class="container">
      <div class="sidebar">
        <div class="card">
          <h2>1. Query</h2>
          <textarea
            id="question"
            rows="5"
            placeholder="Enter your geospatial query..."
          ></textarea>
        </div>

        <div class="card">
          <h2>2. Datasets</h2>
          <input
            type="file"
            id="file-uploader"
            multiple
            style="margin-bottom: 0.5rem"
            onchange="uploadFiles()"
          />
          <div style="font-size: 0.75rem; color: var(--text-dim)">
            Files in <code>data/</code>:
          </div>
          <div class="file-list" id="file-list">Loading...</div>
        </div>

        <button class="btn" id="run-btn" onclick="startAnalysis()">
          <span>▶</span> Run Analysis
        </button>
      </div>

      <div class="main-content">
        <div class="terminal-container">
          <div class="terminal-header">
            <span>PROGRESS TERMINAL & CHAT</span>
            <span id="session-tag">Live</span>
          </div>
          <div class="terminal-body" id="terminal">
            Awaiting analysis request...
          </div>

          <!-- Chat bar to communicate with the main supervisor LLM -->
          <div class="chat-bar">
            <input
              type="text"
              id="chat-input"
              placeholder="Chat with supervisor LLM (e.g. 'what is the sub-agent doing?', 'explain band selection')..."
              onkeydown="if (event.key === 'Enter') sendChat();"
            />
            <button
              class="btn"
              onclick="sendChat()"
              style="padding: 0.5rem 1rem"
            >
              Send
            </button>
          </div>
        </div>

        <div class="card" id="results-card" style="display: none">
          <h2>3. Output Maps & Artifacts</h2>
          <div class="gallery" id="gallery"></div>
          <div style="margin-top: 1rem" id="downloads"></div>
        </div>
      </div>
    </div>

    <script>
      let currentEvtSource = null;
      async function loadFiles() {
        const res = await fetch("/api/files");
        const data = await res.json();
        const list = document.getElementById("file-list");
        list.innerHTML = "";
        data.files.forEach((f) => {
          list.innerHTML += `
          <label class="file-item">
            <input type="checkbox" name="dataset" value="${f.name}">
            <span>${f.name}</span>
            <span style="margin-left:auto; color:#6b7280;">${f.size_mb} MB</span>
          </label>
        `;
        });
      }

      async function uploadFiles() {
        const input = document.getElementById("file-uploader");
        if (!input.files.length) return;
        const formData = new FormData();
        for (const f of input.files) formData.append("files", f);
        await fetch("/api/upload", { method: "POST", body: formData });
        loadFiles();
      }

      function renderArtifacts(artifacts) {
        if (!artifacts || !artifacts.length) return;
        const resultsCard = document.getElementById("results-card");
        const gallery = document.getElementById("gallery");
        const downloads = document.getElementById("downloads");
        const status = document.getElementById("status-indicator");

        resultsCard.style.display = "block";
        status.innerText = "● Analysis Finished (Outputs Ready)";
        status.style.color = "#10b981";

        gallery.innerHTML = "";
        downloads.innerHTML = "";

        artifacts.forEach((art) => {
          if (art.type === "image") {
            gallery.innerHTML += `
            <div class="gallery-item">
              <img src="${art.url}" onclick="window.open('${art.url}')" title="Click to open image in full resolution">
              <div class="gallery-caption">📊 ${art.name}</div>
            </div>
          `;
          } else {
            downloads.innerHTML += `<a href="${art.url}" download class="file-badge">📦 ${art.name}</a>`;
          }
        });

        resultsCard.scrollIntoView({ behavior: "smooth" });
      }

      function setInputsState(disabled, clear = false) {
        const qElem = document.getElementById("question");
        const runBtn = document.getElementById("run-btn");
        const uploader = document.getElementById("file-uploader");
        const checkboxes = document.querySelectorAll('input[name="dataset"]');

        if (runBtn) runBtn.disabled = disabled;
        if (uploader) uploader.disabled = disabled;
        if (qElem) {
          qElem.disabled = disabled;
          if (clear) qElem.value = "";
        }
        checkboxes.forEach((cb) => {
          cb.disabled = disabled;
          if (clear) cb.checked = false;
        });
      }

      function startAnalysis() {
        const question = document.getElementById("question").value.trim();
        if (!question) return alert("Please enter a query.");

        const checked = Array.from(
          document.querySelectorAll('input[name="dataset"]:checked'),
        ).map((c) => c.value);
        const filesParam = checked.join(",");

        const terminal = document.getElementById("terminal");
        const status = document.getElementById("status-indicator");
        const resultsCard = document.getElementById("results-card");

        // 1. Lock/disable query input, checkboxes, and run button while running
        setInputsState(true);

        status.innerText = "● Running (Sub-Agent working)...";
        status.style.color = "#eab308";
        terminal.innerText = "";
        resultsCard.style.display = "none";

        if (currentEvtSource) {
          currentEvtSource.close();
        }

        currentEvtSource = new EventSource(
          `/api/stream_run?question=${encodeURIComponent(question)}&files=${encodeURIComponent(filesParam)}`,
        );

        currentEvtSource.onmessage = (e) => {
          const data = JSON.parse(e.data);
          if (data.type === "log") {
            terminal.innerText += data.text;
            terminal.scrollTop = terminal.scrollHeight;
          } else if (data.type === "artifacts") {
            renderArtifacts(data.artifacts);
          } else if (data.type === "finish") {
            // 2. Re-enable inputs AND clear query and selected files for the next run
            setInputsState(false, true);

            currentEvtSource.close();
            currentEvtSource = null;
          }
        };

        currentEvtSource.onerror = () => {
          // Re-enable on disconnect/error
          setInputsState(false);
          if (currentEvtSource) {
            currentEvtSource.close();
            currentEvtSource = null;
          }
        };
      }

      async function sendChat() {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (!msg) return;
        input.value = "";

        if (msg.toLowerCase() === "quit" || msg.toLowerCase() === "exit") {
          if (currentEvtSource) {
            currentEvtSource.close();
            currentEvtSource = null;
          }
          // Unlock and clear inputs
          setInputsState(false, true);

          const status = document.getElementById("status-indicator");
          if (status) {
            status.innerText = "● Analysis Stopped";
            status.style.color = "#6b7280";
          }
        }

        const term = document.getElementById("terminal");
        term.innerText += `\n> ${msg}\n`;
        term.scrollTop = term.scrollHeight;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });
          if (!res.ok) {
            term.innerText += `\n[Chat note: Analysis session is idle or completed]\n`;
          }
        } catch (err) {
          term.innerText += `\n[Chat error: ${err.message}]\n`;
        }
      }

      window.onload = loadFiles;
    </script>
  </body>
</html>
