<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoLLM — Autonomous Geospatial Agent</title>
    <meta name="description" content="GeoLLM: Run up to 3 concurrent geospatial analyses in isolated Docker sandboxes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Pinned Leaflet + Proj4 for universal CRS support -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
    <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>

    <style>
      :root {
        --bg: #0a0d14;
        --surface: rgba(16, 20, 30, 0.92);
        --border: rgba(255,255,255,0.07);
        --border-active: rgba(99,102,241,0.4);
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --emerald: #10b981;
        --amber: #f59e0b;
        --red: #ef4444;
        --purple: #a855f7;
        --blue: #3b82f6;
        --text: #e5e7eb;
        --text-dim: #6b7280;
        --text-muted: #4b5563;
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Inter', -apple-system, sans-serif;
        --radius: 10px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

      .header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); background: rgba(10,13,20,0.95); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; }
      .logo { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
      .logo-badge { font-size: 0.65rem; background: rgba(99,102,241,0.12); color: var(--primary); padding: 0.2rem 0.5rem; border-radius: 20px; border: 1px solid rgba(99,102,241,0.25); font-weight: 600; letter-spacing: 0.03em; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); display: inline-block; margin-right: 0.35rem; }
      .status-dot.active { background: var(--emerald); animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

      .query-bar { display: flex; gap: 0.75rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); align-items: flex-end; flex-wrap: wrap; }
      .query-bar textarea { flex: 1; min-width: 280px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.75rem; border-radius: var(--radius); font-family: var(--sans); font-size: 0.85rem; resize: vertical; min-height: 42px; max-height: 120px; outline: none; }
      .query-bar textarea:focus { border-color: var(--primary); }
      .query-controls { display: flex; gap: 0.5rem; align-items: flex-end; }
      .bands-input { background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.65rem; border-radius: var(--radius); font-size: 0.78rem; width: 140px; outline: none; }
      .bands-input:focus { border-color: var(--primary); }
      .file-select { background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: #fff; padding: 0.55rem 0.6rem; border-radius: var(--radius); font-size: 0.8rem; min-width: 190px; max-height: 80px; overflow-y: auto; }
      .file-select label { display: flex; align-items: center; gap: 0.4rem; padding: 0.15rem 0; font-size: 0.78rem; cursor: pointer; }
      .btn { background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: var(--radius); font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: all 0.15s; white-space: nowrap; }
      .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
      .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.75rem; }
      .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
      .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: rgba(99,102,241,0.05); }
      .btn-emerald { background: var(--emerald); }

      .upload-area { display: flex; align-items: center; gap: 0.5rem; }
      .upload-area input[type="file"] { display: none; }
      .upload-label { font-size: 0.75rem; color: var(--text-dim); cursor: pointer; padding: 0.4rem 0.7rem; border: 1px dashed var(--border); border-radius: var(--radius); transition: border-color 0.2s; }
      .upload-label:hover { border-color: var(--primary); color: var(--primary); }

      .task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 1rem 1.5rem; flex: 1; min-height: 0; }
      @media (max-width: 1100px) { .task-grid { grid-template-columns: 1fr; } }

      .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.3s; }
      .task-card.active { border-color: var(--border-active); }
      .task-card-header { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); }
      .task-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
      .status-badge { font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
      .status-badge.idle { background: rgba(107,114,128,0.15); color: var(--text-dim); }
      .status-badge.running { background: rgba(168,85,247,0.15); color: var(--purple); }
      .status-badge.pending_approval { background: rgba(245,158,11,0.15); color: var(--amber); }
      .status-badge.done { background: rgba(16,185,129,0.12); color: var(--emerald); }
      .status-badge.partial { background: rgba(245,158,11,0.12); color: var(--amber); }
      .status-badge.failed { background: rgba(239,68,68,0.12); color: var(--red); }

      .task-question { font-size: 0.78rem; color: var(--text); padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--border); min-height: 32px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .milestone-feed { flex: 1; overflow-y: auto; padding: 0.5rem 0.85rem; max-height: 340px; min-height: 180px; }
      .milestone { display: flex; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.75rem; line-height: 1.45; align-items: flex-start; }
      .milestone-icon { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; margin-top: 1px; }
      .milestone-icon.thinking { background: rgba(168,85,247,0.2); color: var(--purple); }
      .milestone-icon.running { background: rgba(59,130,246,0.2); color: var(--blue); }
      .milestone-icon.check { background: rgba(16,185,129,0.2); color: var(--emerald); }
      .milestone-icon.error { background: rgba(239,68,68,0.2); color: var(--red); }
      .milestone-icon.vision { background: rgba(245,158,11,0.2); color: var(--amber); }
      .milestone-icon.plan { background: rgba(99,102,241,0.2); color: var(--primary); }
      .milestone-icon.done { background: rgba(16,185,129,0.2); color: var(--emerald); }
      .milestone-icon.info { background: rgba(107,114,128,0.15); color: var(--text-dim); }
      .milestone-text { color: var(--text-dim); word-break: break-word; }

      .plan-card { margin: 0.5rem 0.85rem; padding: 0.6rem; background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.2); border-radius: var(--radius); }
      .plan-card h4 { font-size: 0.75rem; color: var(--amber); margin-bottom: 0.4rem; }
      .plan-text { font-size: 0.72rem; color: var(--text-dim); max-height: 150px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 0.5rem; line-height: 1.5; }
      .plan-actions { display: flex; gap: 0.5rem; }
      .plan-feedback { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 0.4rem; border-radius: 6px; font-size: 0.72rem; margin-bottom: 0.4rem; outline: none; }

      .task-card-footer { padding: 0.4rem 0.85rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }

      .bottom-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 0 1.5rem 1rem; }
      @media (max-width: 900px) { .bottom-panels { grid-template-columns: 1fr; } }

      .chat-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; max-height: 300px; }
      .chat-header { padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
      .chat-messages { flex: 1; overflow-y: auto; padding: 0.6rem 0.85rem; font-size: 0.8rem; }
      .chat-msg { margin-bottom: 0.5rem; }
      .chat-msg.user { color: var(--primary); }
      .chat-msg.assistant { color: var(--text-dim); }
      .chat-input-bar { display: flex; gap: 0.4rem; padding: 0.5rem 0.85rem; border-top: 1px solid var(--border); }
      .chat-input-bar input { flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: #fff; padding: 0.45rem 0.6rem; border-radius: 6px; font-size: 0.8rem; outline: none; }
      .chat-input-bar input:focus { border-color: var(--primary); }

      .map-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; max-height: 300px; }
      .map-header { padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; }
      #map { flex: 1; min-height: 250px; background: #111; }

      .artifacts-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1.5rem 1rem; }
      .art-badge { display: inline-flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 0.3rem 0.65rem; border-radius: 6px; font-size: 0.72rem; color: #fff; text-decoration: none; transition: all 0.15s; cursor: pointer; }
      .art-badge:hover { border-color: var(--primary); color: var(--primary); }
    </style>
  </head>
  <body>

    <div class="header">
      <div class="logo">🛰️ GeoLLM <span class="logo-badge">Multi-Task Agent</span></div>
      <div style="font-size:0.8rem; color:var(--text-dim)"><span class="status-dot" id="global-dot"></span><span id="global-status">Idle</span></div>
    </div>

    <!-- Query Bar -->
    <div class="query-bar">
      <textarea id="question" rows="1" placeholder="Enter geospatial query..."></textarea>
      <div class="query-controls">
        <div class="file-select" id="file-select">Loading files...</div>
        <div class="upload-area">
          <label class="upload-label" for="file-uploader">📁 Upload</label>
          <input type="file" id="file-uploader" multiple onchange="uploadFiles()" />
        </div>
        <button class="btn" id="run-btn" onclick="submitTask()">▶ Run</button>
      </div>
    </div>

    <!-- 3 Task Cards -->
    <div class="task-grid">
      <div class="task-card" id="card-task_1">
        <div class="task-card-header"><span class="task-label">Task 1</span><span class="status-badge idle" id="badge-task_1">Idle</span></div>
        <div class="task-question" id="question-task_1">—</div>
        <div class="milestone-feed" id="feed-task_1"></div>
        <div id="plan-area-task_1"></div>
        <div class="task-card-footer"><button class="btn btn-sm btn-outline" onclick="cancelTask('task_1')">Cancel</button></div>
      </div>
      <div class="task-card" id="card-task_2">
        <div class="task-card-header"><span class="task-label">Task 2</span><span class="status-badge idle" id="badge-task_2">Idle</span></div>
        <div class="task-question" id="question-task_2">—</div>
        <div class="milestone-feed" id="feed-task_2"></div>
        <div id="plan-area-task_2"></div>
        <div class="task-card-footer"><button class="btn btn-sm btn-outline" onclick="cancelTask('task_2')">Cancel</button></div>
      </div>
      <div class="task-card" id="card-task_3">
        <div class="task-card-header"><span class="task-label">Task 3</span><span class="status-badge idle" id="badge-task_3">Idle</span></div>
        <div class="task-question" id="question-task_3">—</div>
        <div class="milestone-feed" id="feed-task_3"></div>
        <div id="plan-area-task_3"></div>
        <div class="task-card-footer"><button class="btn btn-sm btn-outline" onclick="cancelTask('task_3')">Cancel</button></div>
      </div>
    </div>

    <!-- Artifacts -->
    <div class="artifacts-bar" id="artifacts-bar"></div>

    <!-- Bottom: Chat + Map -->
    <div class="bottom-panels">
      <div class="chat-panel">
        <div class="chat-header">Supervisor Chat</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
          <input id="chat-input" placeholder="Ask about any task..." onkeydown="if(event.key==='Enter')sendChat()" />
          <button class="btn btn-sm" onclick="sendChat()">Send</button>
        </div>
      </div>
      <div class="map-panel">
        <div class="map-header"><span>Map Viewer</span><span id="map-layers-info"></span></div>
        <div id="map"></div>
      </div>
    </div>

    <script>
      const streams = {};
      const chatHistory = [];
      let lastSelectedFiles = [];
      let leafletMap = null;
      let mapLayers = [];

      window.onload = async () => {
        await loadFiles();
        initMap();
        restoreActiveTasks();
      };

      async function restoreActiveTasks() {
        try {
          const res = await fetch('/api/tasks');
          const data = await res.json();
          for (const t of data.tasks) {
            if (t.status === 'running' || t.status === 'pending_approval') {
              streamTask(t.task_id, t.question);
            } else if (t.status === 'done' || t.status === 'failed' || t.status === 'partial') {
              const badge = document.getElementById(`badge-${t.task_id}`);
              const qEl = document.getElementById(`question-${t.task_id}`);
              badge.className = `status-badge ${t.status}`;
              badge.textContent = t.status.charAt(0).toUpperCase() + t.status.slice(1);
              qEl.textContent = t.question;

              // Restore artifacts for finished tasks on page reload
              if (t.status === 'done' || t.status === 'partial') {
                try {
                  const aRes = await fetch(`/api/tasks/${t.task_id}/artifacts`);
                  const aData = await aRes.json();
                  if (aData.artifacts && aData.artifacts.length) {
                    renderArtifacts(t.task_id, aData.artifacts);
                  }
                } catch (_) {}
              }
            }
          }
        } catch (_) {}
      }

      async function loadFiles() {
        const res = await fetch('/api/files');
        const data = await res.json();
        const el = document.getElementById('file-select');
        el.innerHTML = '';
        data.files.forEach(f => {
          const escName = escHtml(f.name);
          el.innerHTML += `<label><input type="checkbox" name="dataset" value="${escName}"> ${escName} <span style="color:var(--text-muted);margin-left:auto">${f.size_mb}MB</span></label>`;
        });
      }

      async function uploadFiles() {
        const input = document.getElementById('file-uploader');
        if (!input.files.length) return;
        const fd = new FormData();
        for (const f of input.files) fd.append('files', f);
        await fetch('/api/upload', { method: 'POST', body: fd });
        loadFiles();
      }

      async function submitTask(explicitQuestion = null, explicitFiles = null) {
        const q = explicitQuestion || document.getElementById('question').value.trim();
        if (!q) return alert('Enter a query.');

        let checked = explicitFiles;
        if (!checked) {
          checked = Array.from(document.querySelectorAll('input[name="dataset"]:checked')).map(c => c.value);
        }
        if (!checked || checked.length === 0) {
          checked = lastSelectedFiles;
        }
        if (!checked || checked.length === 0) {
          return alert('Please select at least one dataset file.');
        }

        lastSelectedFiles = checked;

        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, files: checked.join(',') })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);

        document.getElementById('question').value = '';
        document.querySelectorAll('input[name="dataset"]').forEach(c => c.checked = false);

        streamTask(data.task_id, q);
      }

      function streamTask(taskId, question) {
        const card = document.getElementById(`card-${taskId}`);
        const badge = document.getElementById(`badge-${taskId}`);
        const qEl = document.getElementById(`question-${taskId}`);
        const feed = document.getElementById(`feed-${taskId}`);

        card.classList.add('active');
        badge.className = 'status-badge running';
        badge.textContent = 'Running';
        qEl.textContent = question;
        feed.innerHTML = '';
        updateGlobal();

        if (streams[taskId]) streams[taskId].close();

        const es = new EventSource(`/api/tasks/${taskId}/stream`);
        streams[taskId] = es;

        es.onmessage = (e) => {
          const d = JSON.parse(e.data);

          if (d.type === 'milestone') {
            addMilestone(taskId, d.icon, d.text);
          } else if (d.type === 'step') {
            badge.textContent = d.text.slice(0, 30);
          } else if (d.type === 'plan_ready') {
            showPlanCard(taskId, d.plan);
            badge.className = 'status-badge pending_approval';
            badge.textContent = 'Awaiting Approval';
          } else if (d.type === 'artifacts') {
            renderArtifacts(taskId, d.artifacts);
          } else if (d.type === 'finish') {
            badge.className = `status-badge ${d.status}`;
            badge.textContent = d.status.charAt(0).toUpperCase() + d.status.slice(1);
            if (d.error) addMilestone(taskId, 'error', d.error);
            card.classList.remove('active');
            es.close();
            delete streams[taskId];
            updateGlobal();
          }
        };

        es.onerror = () => { es.close(); delete streams[taskId]; updateGlobal(); };
      }

      const ICONS = {
        thinking: '🟣', running: '⚙️', check: '✅', error: '❌',
        vision: '🔍', plan: '📋', done: '✅', info: 'ℹ️'
      };
      function addMilestone(taskId, icon, text) {
        const feed = document.getElementById(`feed-${taskId}`);
        const div = document.createElement('div');
        div.className = 'milestone';
        div.innerHTML = `<span class="milestone-icon ${icon}">${ICONS[icon]||'•'}</span><span class="milestone-text">${escHtml(text)}</span>`;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
      }

      function showPlanCard(taskId, plan) {
        const area = document.getElementById(`plan-area-${taskId}`);
        area.innerHTML = `
          <div class="plan-card">
            <h4>📋 Analysis Plan — Review Required</h4>
            <div class="plan-text">${escHtml(plan)}</div>
            <input class="plan-feedback" id="feedback-${taskId}" placeholder="Optional revision feedback..." />
            <div class="plan-actions">
              <button class="btn btn-sm btn-emerald" onclick="approvePlan('${taskId}')">✓ Approve & Run</button>
              <button class="btn btn-sm btn-outline" onclick="revisePlan('${taskId}')">✎ Revise</button>
            </div>
          </div>`;
      }

      async function approvePlan(taskId) {
        await fetch(`/api/tasks/${taskId}/approve`, { method: 'POST' });
        document.getElementById(`plan-area-${taskId}`).innerHTML = '';
        document.getElementById(`badge-${taskId}`).className = 'status-badge running';
        document.getElementById(`badge-${taskId}`).textContent = 'Executing';
      }

      async function revisePlan(taskId) {
        const fb = document.getElementById(`feedback-${taskId}`).value.trim();
        if (!fb) return alert('Enter revision feedback.');
        await fetch(`/api/tasks/${taskId}/revise`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feedback: fb })
        });
        document.getElementById(`plan-area-${taskId}`).innerHTML = '<div style="padding:0.5rem 0.85rem;font-size:0.72rem;color:var(--amber)">Revision sent, waiting for updated plan...</div>';
      }

      async function cancelTask(taskId) {
        await fetch(`/api/tasks/${taskId}/cancel`, { method: 'POST' });
        if (streams[taskId]) { streams[taskId].close(); delete streams[taskId]; }
        document.getElementById(`badge-${taskId}`).className = 'status-badge failed';
        document.getElementById(`badge-${taskId}`).textContent = 'Cancelled';
        document.getElementById(`card-${taskId}`).classList.remove('active');
        updateGlobal();
      }

      async function sendChat() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        appendChat('user', msg);
        chatHistory.push({ role: 'user', content: msg });

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, history: chatHistory })
          });
          const data = await res.json();
          const replyText = data.reply || data.error || 'No response';
          appendChat('assistant', replyText);
          chatHistory.push({ role: 'assistant', content: replyText });

          if (data.is_run_job && data.proposed_job) {
            const container = document.getElementById('chat-messages');
            const runBtn = document.createElement('button');
            runBtn.className = 'btn btn-sm btn-emerald';
            runBtn.style.marginTop = '6px';
            runBtn.textContent = '🚀 Run Proposed Job';
            runBtn.onclick = () => {
              submitTask(data.proposed_job, lastSelectedFiles);
            };
            container.appendChild(runBtn);
            container.scrollTop = container.scrollHeight;
          }
        } catch (err) {
          appendChat('assistant', `Error: ${err.message}`);
        }
      }

      function appendChat(role, text) {
        const el = document.getElementById('chat-messages');
        el.innerHTML += `<div class="chat-msg ${role}"><strong>${role === 'user' ? '> ' : '🤖 '}</strong>${escHtml(text)}</div>`;
        el.scrollTop = el.scrollHeight;
      }

      function renderArtifacts(taskId, artifacts) {
        const bar = document.getElementById('artifacts-bar');
        artifacts.forEach(a => {
          if (a.type === 'image') {
            const badge = document.createElement('a');
            badge.className = 'art-badge';
            badge.href = a.url;
            badge.target = '_blank';
            badge.innerHTML = `📊 ${escHtml(a.name)}`;
            bar.appendChild(badge);
          } else if (a.type === 'raster' && (a.ext === '.tif' || a.ext === '.tiff')) {
            const badge = document.createElement('span');
            badge.className = 'art-badge';
            badge.innerHTML = `🗺️ ${escHtml(a.name)}`;
            badge.onclick = () => loadGeoTIFF(a.url);
            bar.appendChild(badge);
          } else {
            const badge = document.createElement('a');
            badge.className = 'art-badge';
            badge.href = a.url;
            badge.download = '';
            badge.innerHTML = `📦 ${escHtml(a.name)}`;
            bar.appendChild(badge);
          }
        });
        addMilestone(taskId, 'done', `${artifacts.length} artifact(s) ready`);
      }

            function initMap() {
        leafletMap = L.map('map', { zoomControl: true }).setView([20, 0], 2);
        // Free OpenStreetMap tiles — zero API key required
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
        }).addTo(leafletMap);
        setTimeout(() => leafletMap.invalidateSize(), 300);
      }


      async function loadGeoTIFF(url) {
        try {
          document.getElementById('map-layers-info').textContent = 'Loading GeoTIFF...';
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          const georaster = await parseGeoraster(arrayBuffer);

          const layer = new GeoRasterLayer({
            georaster,
            opacity: 0.75,
            resolution: 256,
            pixelValuesToColorFn: values => {
              const v = values[0];
              if (v === null || v === undefined || isNaN(v)) return null;
              const min = georaster.mins[0] || 0;
              const max = georaster.maxs[0] || 1;
              const t = Math.max(0, Math.min(1, (v - min) / ((max - min) || 1)));
              const r = Math.round(68 + t * 187);
              const g = Math.round(1 + t * 190);
              const b = Math.round(84 + t * (213 - 84));
              return `rgba(${r},${g},${b},0.85)`;
            }
          });

          layer.addTo(leafletMap);
          mapLayers.push(layer);
          leafletMap.fitBounds(layer.getBounds());
          document.getElementById('map-layers-info').textContent = `${mapLayers.length} active layer(s)`;
        } catch (err) {
          document.getElementById('map-layers-info').textContent = `Map Error: ${err.message}`;
        }
      }

      function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function updateGlobal() {
        const active = Object.keys(streams).length;
        const dot = document.getElementById('global-dot');
        const st = document.getElementById('global-status');
        if (active > 0) { dot.classList.add('active'); st.textContent = `${active} task(s) running`; }
        else { dot.classList.remove('active'); st.textContent = 'Idle'; }
      }
    </script>
  </body>
